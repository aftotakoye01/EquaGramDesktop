name: Build EquaGram for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/../ThirdParty
            ${{ github.workspace }}/../Libraries
          key: equagram-vs2022-dependencies-${{ runner.os }}-${{ hashFiles('Telegram/build/prepare/prepare.py') }}-${{ github.run_id }}
          restore-keys: |
            equagram-vs2022-dependencies-${{ runner.os }}-${{ hashFiles('Telegram/build/prepare/prepare.py') }}-
            equagram-vs2022-dependencies-${{ runner.os }}-

      - name: Check Visual Studio components
        shell: pwsh
        run: |
          $installerDirectory = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vswhere = Join-Path $installerDirectory "vswhere.exe"

          $vs = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.ATL `
            -property installationPath

          if (-not $vs) {
            throw "Visual Studio with ATL was not found."
          }

          Write-Host "Visual Studio with ATL: $vs"

          $atlHeader = Get-ChildItem `
            "$vs\VC\Tools\MSVC\*\atlmfc\include\atlbase.h" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $atlHeader) {
            throw "ATL component is listed, but atlbase.h was not found."
          }

          Write-Host "ATL header: $($atlHeader.FullName)"

      - name: Prepare libraries
        shell: cmd
        run: |
          set "VS="

          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VS=%%i"

          if not defined VS (
            echo Visual Studio was not found.
            exit /b 1
          )

          echo Visual Studio: %VS%

          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1

          call Telegram\build\prepare\win.bat silent
          if errorlevel 1 exit /b 1

          exit /b 0

      - name: Save dependency cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/../ThirdParty
            ${{ github.workspace }}/../Libraries
          key: equagram-vs2022-dependencies-${{ runner.os }}-${{ hashFiles('Telegram/build/prepare/prepare.py') }}-${{ github.run_id }}

      - name: Configure project
        shell: cmd
        run: |
          set "VS="

          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VS=%%i"

          if not defined VS (
            echo Visual Studio was not found.
            exit /b 1
          )

          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1

          cd Telegram

          call configure.bat x64 -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }}
          if errorlevel 1 exit /b 1

          exit /b 0

      - name: Build EquaGram
        shell: cmd
        run: |
          set "VS="

          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VS=%%i"

          if not defined VS (
            echo Visual Studio was not found.
            exit /b 1
          )

          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1

          cmake --build out --config Release --target Telegram --parallel 4
          if errorlevel 1 exit /b 1

          exit /b 0

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: EquaGram-Windows-x64
          path: out/Release/
          if-no-files-found: error
          retention-days: 7
