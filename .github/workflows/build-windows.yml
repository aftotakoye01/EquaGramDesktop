name: Build EquaGram for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Check Telegram API secrets
        shell: pwsh
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if ($env:TDESKTOP_API_ID -notmatch '^[1-9][0-9]*$') {
            throw "TDESKTOP_API_ID must contain a positive number without spaces or quotes."
          }

          if ($env:TDESKTOP_API_HASH -notmatch '^[a-fA-F0-9]{32}$') {
            throw "TDESKTOP_API_HASH must contain 32 hexadecimal characters without spaces or quotes."
          }

          Write-Host "API secrets have the expected format."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Find Visual Studio 2022
        shell: pwsh
        run: |
          $vswhere = Join-Path `
            ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe was not found at: $vswhere"
          }

          $installations = @(
            & $vswhere `
              -latest `
              -products '*' `
              -version '[17.0,18.0)' `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
          )

          if ($LASTEXITCODE -ne 0) {
            throw "vswhere.exe failed with exit code $LASTEXITCODE."
          }

          $vs = $installations |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Select-Object -First 1

          if (-not $vs) {
            throw "Visual Studio 2022 with C++ build tools was not found."
          }

          $vs = $vs.Trim()
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"

          if (-not (Test-Path -LiteralPath $vcvars)) {
            throw "vcvars64.bat was not found at: $vcvars"
          }

          "VS_INSTALL_PATH=$vs" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Visual Studio: $vs"

      - name: Check build tools and ATL
        shell: cmd
        run: |
          call "%VS_INSTALL_PATH%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1

          if not defined VCToolsInstallDir (
            echo ERROR: VCToolsInstallDir is not set.
            exit /b 1
          )

          if not exist "%VCToolsInstallDir%atlmfc\include\atlbase.h" (
            echo ERROR: atlbase.h is missing for MSVC 14.44.
            exit /b 1
          )

          if not exist "%VCToolsInstallDir%atlmfc\include\atlcomcli.h" (
            echo ERROR: atlcomcli.h is missing for MSVC 14.44.
            exit /b 1
          )

          python --version
          if errorlevel 1 exit /b 1

          cmake --version
          if errorlevel 1 exit /b 1

          ninja --version
          if errorlevel 1 exit /b 1

          echo Compiler directory: %VCToolsInstallDir%
          echo Windows SDK version: %WindowsSDKVersion%
          echo Build tools and ATL checks passed.

      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/../ThirdParty
            ${{ github.workspace }}/../Libraries
          key: equagram-vs2022-dependencies-${{ runner.os }}-${{ hashFiles('Telegram/build/prepare/prepare.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            equagram-vs2022-dependencies-${{ runner.os }}-${{ hashFiles('Telegram/build/prepare/prepare.py') }}-
            equagram-vs2022-dependencies-${{ runner.os }}-

      - name: Prepare libraries
        id: prepare
        shell: cmd
        run: |
          call "%VS_INSTALL_PATH%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1

          call Telegram\build\prepare\win.bat silent
          if errorlevel 1 exit /b 1

          exit /b 0

      - name: Save dependency cache
        if: ${{ always() && (steps.prepare.outcome == 'success' || steps.prepare.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/../ThirdParty
            ${{ github.workspace }}/../Libraries
          key: equagram-vs2022-dependencies-${{ runner.os }}-${{ hashFiles('Telegram/build/prepare/prepare.py') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure project
        shell: cmd
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
          CMAKE_GENERATOR: Visual Studio 17 2022
        run: |
          call "%VS_INSTALL_PATH%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1

          cd /d "%GITHUB_WORKSPACE%\Telegram"
          if errorlevel 1 exit /b 1

          call configure.bat x64 ^
            -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
            -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH%
          if errorlevel 1 exit /b 1

          exit /b 0

      - name: Build EquaGram
        shell: cmd
        env:
          _CL_: /MP2 /FS
        run: |
          call "%VS_INSTALL_PATH%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1

          cmake --build out --config Release --target Telegram --parallel 2
          if errorlevel 1 exit /b 1

          exit /b 0

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: EquaGram-Windows-x64
          path: out/Release/
          if-no-files-found: error
          retention-days: 7
