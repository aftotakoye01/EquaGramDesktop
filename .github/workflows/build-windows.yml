name: Build EquaGram for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Check Telegram API secrets
        shell: pwsh
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if ($env:TDESKTOP_API_ID -notmatch '^[1-9][0-9]*$') {
            throw "TDESKTOP_API_ID must be a positive number without spaces or quotes."
          }
          if ($env:TDESKTOP_API_HASH -notmatch '^[a-fA-F0-9]{32}$') {
            throw "TDESKTOP_API_HASH must contain 32 hexadecimal characters."
          }
          Write-Host "API secrets have the expected format."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Find Visual Studio 2022
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe was not found."
          }
          $installations = @(
            & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          )
          if ($LASTEXITCODE -ne 0) {
            throw "vswhere.exe failed with exit code $LASTEXITCODE."
          }
          $vs = $installations |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Select-Object -First 1
          if (-not $vs) {
            throw "Visual Studio 2022 with C++ build tools was not found."
          }
          $vs = $vs.Trim()
          if (-not (Test-Path -LiteralPath (Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"))) {
            throw "vcvars64.bat was not found."
          }
          "VS_INSTALL_PATH=$vs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Visual Studio: $vs"

      - name: Check build tools and ATL
        shell: cmd
        run: |
          call "%VS_INSTALL_PATH%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1
          if not defined VCToolsInstallDir exit /b 1
          if not exist "%VCToolsInstallDir%atlmfc\include\atlbase.h" (
            echo ERROR: atlbase.h is missing for MSVC 14.44.
            exit /b 1
          )
          if not exist "%VCToolsInstallDir%atlmfc\include\atlcomcli.h" (
            echo ERROR: atlcomcli.h is missing for MSVC 14.44.
            exit /b 1
          )
          python --version
          if errorlevel 1 exit /b 1
          cmake --version
          if errorlevel 1 exit /b 1
          ninja --version
          if errorlevel 1 exit /b 1

      - name: Resolve dependency cache paths
        id: paths
        shell: pwsh
        run: |
          $root = Split-Path -Parent $env:GITHUB_WORKSPACE
          $thirdParty = Join-Path $root "ThirdParty"
          $libraries = Join-Path $root "Libraries"
          "third_party=$thirdParty" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "libraries=$libraries" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "ThirdParty: $thirdParty"
          Write-Host "Libraries: $libraries"

      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.paths.outputs.third_party }}
            ${{ steps.paths.outputs.libraries }}
          key: equagram-vs2022-dependencies-${{ runner.os }}-${{ hashFiles('Telegram/build/prepare/prepare.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            equagram-vs2022-dependencies-${{ runner.os }}-${{ hashFiles('Telegram/build/prepare/prepare.py') }}-
            equagram-vs2022-dependencies-${{ runner.os }}-

      - name: Prepare libraries
        id: prepare
        shell: cmd
        run: |
          call "%VS_INSTALL_PATH%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1
          call Telegram\build\prepare\win.bat silent
          if errorlevel 1 exit /b 1
          exit /b 0

      - name: Save dependency cache
        if: ${{ always() && (steps.prepare.outcome == 'success' || steps.prepare.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.paths.outputs.third_party }}
            ${{ steps.paths.outputs.libraries }}
          key: equagram-vs2022-dependencies-${{ runner.os }}-${{ hashFiles('Telegram/build/prepare/prepare.py') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure project with header wrappers
        shell: cmd
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
          CMAKE_GENERATOR: Visual Studio 17 2022
        run: |
          call "%VS_INSTALL_PATH%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1
          cd /d "%GITHUB_WORKSPACE%\Telegram"
          if errorlevel 1 exit /b 1
          call configure.bat x64 ^
            -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
            -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
            -D CMAKE_DISABLE_PRECOMPILE_HEADERS:BOOL=OFF
          if errorlevel 1 exit /b 1
          exit /b 0

      - name: Check generated header wrappers
        shell: pwsh
        run: |
          $cachePath = "out/CMakeCache.txt"
          if (-not (Test-Path -LiteralPath $cachePath)) {
            throw "CMakeCache.txt was not generated."
          }
          if (-not (Select-String -Path $cachePath -Pattern '^CMAKE_DISABLE_PRECOMPILE_HEADERS:BOOL=OFF$' -Quiet)) {
            throw "CMAKE_DISABLE_PRECOMPILE_HEADERS must be OFF to retain forced header includes."
          }
          $headers = @(Get-ChildItem -Path out -Recurse -Filter cmake_pch.hxx)
          if ($headers.Count -eq 0) {
            throw "CMake header wrappers were not generated."
          }
          Write-Host "Generated header wrappers: $($headers.Count)"
          Write-Host "The build will use /Y- to parse these headers normally instead of using binary PCH."

      - name: Show available memory
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host ("Total RAM: {0:N1} GB" -f ($os.TotalVisibleMemorySize / 1MB))
          Write-Host ("Free RAM: {0:N1} GB" -f ($os.FreePhysicalMemory / 1MB))
          Write-Host ("Total virtual memory: {0:N1} GB" -f ($os.TotalVirtualMemorySize / 1MB))
          Write-Host ("Free virtual memory: {0:N1} GB" -f ($os.FreeVirtualMemory / 1MB))

      - name: Build EquaGram with normal header parsing
        shell: cmd
        env:
          _CL_: /MP1 /FS /Y-
          MSBUILDDISABLENODEREUSE: "1"
        run: |
          call "%VS_INSTALL_PATH%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1
          cmake --build out ^
            --config Release ^
            --target Telegram ^
            --parallel 1 ^
            -- ^
            /p:PreferredToolArchitecture=x64 ^
            /p:UseMultiToolTask=false ^
            /nr:false
          if errorlevel 1 exit /b 1
          exit /b 0

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: EquaGram-Windows-x64
          path: out/Release/
          if-no-files-found: error
          retention-days: 7
